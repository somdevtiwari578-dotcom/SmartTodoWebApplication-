<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartTodo - Todos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>SmartTodo</h1>
      <span id="welcomeText" class="muted"></span>
    </div>
    <button id="logoutBtn" class="secondary">Logout</button>
  </header>

  <main class="container">
    <section class="card">
      <h2>Add Todo</h2>
      <form id="todoForm" class="todo-form">
        <input id="todoTitle" type="text" required placeholder="Todo title">
        <input id="todoDescription" type="text" placeholder="Description">
        <label class="check">
          <input id="todoCompleted" type="checkbox">
          Completed
        </label>
        <button type="submit">Add Todo</button>
      </form>
      <p id="todoMessage" class="message"></p>
    </section>

    <section class="card">
      <div class="toolbar">
        <div>
          <h2>My Todos</h2>
          <p class="muted">Search, filter and paginate your tasks</p>
        </div>
        <button id="refreshBtn" class="secondary">Refresh</button>
      </div>

      <div class="filters">
        <input id="searchInput" type="search" placeholder="Search...">
        <select id="completedFilter">
          <option value="">All</option>
          <option value="true">Completed</option>
          <option value="false">Pending</option>
        </select>
        <select id="pageSize">
          <option value="5">5 per page</option>
          <option value="10">10 per page</option>
          <option value="20">20 per page</option>
        </select>
        <button id="searchBtn">Apply</button>
      </div>

      <div id="todoList" class="todo-list"></div>

      <div class="pagination">
        <button id="prevBtn" class="secondary">Previous</button>
        <span id="pageInfo">Page 1</span>
        <button id="nextBtn" class="secondary">Next</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
