<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartTodo - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="auth-page">
    <section class="card auth-card">
      <h1>SmartTodo</h1>
      <p class="muted">Login to manage your tasks</p>

      <form id="loginForm">
        <label for="loginEmail">Email</label>
        <input id="loginEmail" type="email" required placeholder="rahul@gmail.com">

        <label for="loginPassword">Password</label>
        <input id="loginPassword" type="password" required placeholder="••••••••">

        <button type="submit">Login</button>
      </form>

      <p id="loginMessage" class="message"></p>
      <p class="switch">Don't have an account?
        <a href="register.html">Register</a>
      </p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
